appId: com.daler.dlauncher
productName: DLauncher
directories:
  buildResources: build
  output: dist
# Electron из node_modules: свежераспакованный архив Защитник Windows держит при проверке,
# и электрон-билдер падает с EPERM на переименовании win-unpacked.tmp
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
win:
  target: nsis
  icon: build/icon.png
  artifactName: DLauncher-Setup-${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: DLauncher
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
publish:
  provider: github
  owner: Daler2010
  repo: dlauncher
  releaseType: release
